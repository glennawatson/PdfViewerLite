name: Release HyperPdfLibrary
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Release level for the new tag. Ignored when versionOverride is set.'
        required: true
        type: choice
        options:
        - major
        - minor
        - patch
      preRelease:
        description: 'Pre-release channel (e.g. beta, rc). Empty = stable release.'
        required: false
        type: string
        default: ''
      versionOverride:
        description: 'Exact version to release (e.g. 1.4.2), bypassing the bump.'
        required: false
        type: string
        default: ''
      sourceRef:
        description: 'Git ref (tag, branch or SHA) to release from. Empty = the ref this run was started on.'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
      packages: read
    uses: glennawatson/actions-common/.github/workflows/workflow-common-release.yml@7f2014219353aee799dfeef2a9b97acaeabca0b8 # main
    with:
      srcFolder: '.'
      solutionFile: src/HyperPdfLibrary/HyperPdfLibrary.csproj
      buildOs: ubuntu-latest
      dotnetVersions: |
        10.x
        11.x
      bump: ${{ inputs.versionOverride == '' && inputs.bump || '' }}
      preRelease: ${{ inputs.preRelease }}
      versionOverride: ${{ inputs.versionOverride }}
      sourceRef: ${{ inputs.sourceRef }}
    secrets:
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}

  publish-nuget:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@7f2014219353aee799dfeef2a9b97acaeabca0b8 # main
      with:
        stamp-version: 'false'
        dotnet-versions: |
          11.x
    - name: Download signed packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: signed-nuget
        path: signed
    - name: NuGet login (OIDC trusted publishing)
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push to NuGet
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push "signed/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

  create-release:
    needs: [release, publish-nuget]
    permissions:
      contents: write
    uses: glennawatson/actions-common/.github/workflows/workflow-common-create-release.yml@7f2014219353aee799dfeef2a9b97acaeabca0b8 # main
    with:
      version: ${{ needs.release.outputs.semver2 }}
      tag: ${{ needs.release.outputs.tag }}
      target: ${{ needs.release.outputs.sourceSha }}
      prerelease: ${{ needs.release.outputs.prerelease == 'true' }}
