name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: write
jobs:
  build:
    name: Build and test
    uses: glennawatson/actions-common/.github/workflows/workflow-common-setup-and-build.yml@952c87a450f5e4f2d6d52f8198e1c04a577008f5 # main
    with:
      srcFolder: '.'
      solutionFile: PdfViewerLite.slnx
      minverTagPrefix: ''
      uploadCodecov: false
      dotnetVersions: |
        10.x
        11.x
