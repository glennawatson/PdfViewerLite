name: Build

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 1

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dotnet-environment
        with:
          dotnet-versions: |
            10.0.x
            11.0.100-rc.1.26425.128
          minver-minimum-major-minor: '0.1'
      - name: Prepare test services
        run: dotnet run --file tools/ci/prepare.cs -- test
      - name: Cache voices and PDF corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/pdfviewerlite/kokoro
            ~/.cache/pdfviewerlite/melo
            ~/.cache/pdfviewerlite/corpus
          key: models-${{ runner.os }}-${{ hashFiles('src/PdfViewerLite.Speech/VoiceRelease.cs', 'tests/corpus/corpus.json') }}
      - uses: ./.github/actions/dotnet-build
        with:
          src-folder: .
          solution-file: PdfViewerLite.slnx
      - name: Build C# tools
        if: runner.os == 'Linux'
        run: dotnet run --file tools/ci/build-tools.cs
      - uses: ./.github/actions/dotnet-test
        with:
          src-folder: .
          solution-file: PdfViewerLite.slnx
        env:
          PDFVIEWERLITE_KOKORO_DOWNLOAD: '1'
          PDFVIEWERLITE_MELO_DOWNLOAD: '1'
          PDFVIEWERLITE_CORPUS_DOWNLOAD: '1'

  package:
    name: Package ${{ matrix.rid }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
            platform: linux
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux
          - rid: win-x64
            os: windows-latest
            platform: windows
          - rid: win-arm64
            os: windows-latest
            platform: windows
          - rid: osx-arm64
            os: macos-latest
            platform: macos
          - rid: osx-x64
            os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dotnet-environment
        id: environment
        with:
          dotnet-versions: |
            10.0.x
            11.0.100-rc.1.26425.128
          minver-minimum-major-minor: '0.1'
      - name: Prepare native toolchain
        run: dotnet run --file tools/ci/prepare.cs -- package
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: matrix.platform == 'linux'
        with:
          go-version: stable
      - name: Publish Native AOT
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ steps.environment.outputs.version-semver2 }}
        run: dotnet run --file tools/packaging/publish.cs -- "$RID" "$VERSION"
      - name: Screen reader check
        if: matrix.platform == 'linux'
        run: scripts/check-screen-reader.sh artifacts/${{ matrix.rid }}/pdfviewerlite
      - name: Validate desktop entry
        if: matrix.platform == 'linux'
        run: desktop-file-validate packaging/linux/net.glennwatson.PdfViewerLite.desktop
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: matrix.platform == 'windows'
        with:
          path: artifacts/msix-sdk
          key: msix-sdk-${{ runner.os }}-${{ hashFiles('tools/packaging/windows.cs') }}
      - name: Package
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ steps.environment.outputs.version-semver2 }}
          PLATFORM: ${{ matrix.platform }}
        run: dotnet run --file "tools/packaging/$PLATFORM.cs" -- "$RID" "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages-${{ matrix.rid }}
          path: |
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.tar.gz
            artifacts/*.msix
            artifacts/*.msi
            artifacts/*.zip
            artifacts/*.dmg
          if-no-files-found: error

  sign-windows:
    name: Sign Windows installers
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/reactiveui/certum-signer:latest@sha256:a609cf99c5bdb673fa7b1e48c2dd6c3b0a559377a0278f673889f3b2f4ebe6ce
    env:
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: packages-win-*
          merge-multiple: true
          path: signed
      - uses: ./.github/actions/certum-sign
        with:
          packages-glob: signed/*.msi*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-windows
          path: signed/*.msi*
          if-no-files-found: error

  verify-windows:
    name: Verify Windows signatures
    needs: sign-windows
    runs-on: windows-latest
    env:
      CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dotnet-environment
        with:
          dotnet-versions: |
            10.0.x
            11.0.100-rc.1.26425.128
          minver-minimum-major-minor: '0.1'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-windows
          path: signed
      - name: Verify installers
        run: dotnet run --file tools/signing/verify-all.cs -- signed

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, verify-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: packages
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-windows
          path: packages
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: packages/*
          prerelease: ${{ contains(github.ref_name, '-') }}
