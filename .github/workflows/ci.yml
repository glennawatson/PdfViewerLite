name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: write
jobs:
  build:
    name: Build and test
    uses: glennawatson/actions-common/.github/workflows/workflow-common-setup-and-build.yml@5b418d6c499a0586b4b21ec2801250c35828da2e # main
    with:
      srcFolder: '.'
      solutionFile: PdfViewerLite.slnx
      minverTagPrefix: ''
      uploadCodecov: false
      dotnetVersions: |
        10.x
        11.x
