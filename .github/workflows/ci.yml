name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-26.04, ubuntu-26.04-arm, macos-latest]
    uses: glennawatson/actions-common/.github/workflows/workflow-common-setup-and-build.yml@42a51961108cbfe0b325af8ee49fb35ff6ce6269 # main
    with:
      runner: ${{ matrix.os }}
      srcFolder: '.'
      solutionFile: PdfViewerLite.slnx
      stampVersion: false
      testPreparationProject: tools/PdfViewerLite.Tools/PdfViewerLite.Tools.csproj
      testPreparationArguments: '["ci","prepare","test"]'
      dotnetVersions: |
        10.0.x
        11.0.100-rc.1.26425.128
