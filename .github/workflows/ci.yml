name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: write
jobs:
  build:
    name: Build and test
    uses: glennawatson/actions-common/.github/workflows/workflow-common-setup-and-build.yml@63224e9b18882971ff92bbe106c9002174718608 # main
    with:
      srcFolder: '.'
      solutionFile: PdfViewerLite.slnx
      minverTagPrefix: ''
      uploadCodecov: false
      dotnetVersions: |
        10.x
        11.x
