name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Release level for the new tag. Pick one, unless versionOverride is set.'
        required: true
        type: choice
        options:
        - '(pick one)'
        - major
        - minor
        - patch
      preRelease:
        description: 'Pre-release channel (e.g. beta, rc). The version becomes <bumped-core>-<channel>.<N>. Empty = stable release.'
        required: false
        type: string
        default: ''
      versionOverride:
        description: 'Exact version to release (e.g. 1.0.0), bypassing the bump from the latest tag. Leave bump at "(pick one)".'
        required: false
        type: string
        default: ''
      sourceRef:
        description: 'Git ref (tag, branch or SHA) to release from. Empty = the ref this run was started on.'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      semver2: ${{ steps.minver.outputs.SemVer2 }}
      tag: ${{ steps.tagname.outputs.tag }}
      prerelease: ${{ steps.tagname.outputs.prerelease }}
      sourceSha: ${{ steps.sourcesha.outputs.sha }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.sourceRef }}
        fetch-depth: 0
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@5e0bd6d05eb07c7ee0bb7930596d9d38dc6e0070 # main
      with:
        dotnet-versions: |
          11.0.100-rc.1.26425.128
        stamp-version: 'false'
    - name: Resolve built commit SHA
      id: sourcesha
      uses: glennawatson/actions-common/.github/actions/run-csharp@5e0bd6d05eb07c7ee0bb7930596d9d38dc6e0070 # main
      with:
        shared-script: resolve-built-commit-sha-c775df1621.cs
    - name: Validate version inputs
      env:
        BUMP: ${{ inputs.bump }}
        PRE_RELEASE: ${{ inputs.preRelease }}
        VERSION_OVERRIDE: ${{ inputs.versionOverride }}
      uses: glennawatson/actions-common/.github/actions/run-csharp@5e0bd6d05eb07c7ee0bb7930596d9d38dc6e0070 # main
      with:
        shared-script: validate-version-inputs-2aad3ac3e2.cs
    - name: Compute version and tag
      if: inputs.bump != '(pick one)' && inputs.versionOverride == ''
      id: bump
      uses: glennawatson/actions-common/.github/actions/compute-version-and-tag@5e0bd6d05eb07c7ee0bb7930596d9d38dc6e0070 # main
      with:
        bump: ${{ inputs.bump }}
        tag-prefix: ''
        pre-release-id: ${{ inputs.preRelease }}
        push-tag: 'false'
    - name: Resolve release tag
      id: tagname
      env:
        BUMP_TAG: ${{ steps.bump.outputs.tag }}
        BUMP_PRERELEASE: ${{ steps.bump.outputs.prerelease }}
        VERSION_OVERRIDE: ${{ inputs.versionOverride }}
      uses: glennawatson/actions-common/.github/actions/run-csharp@5e0bd6d05eb07c7ee0bb7930596d9d38dc6e0070 # main
      with:
        shared-script: resolve-release-tag-d98a6a5208.cs
    - name: Stamp version with MinVer
      id: minver
      uses: glennawatson/actions-common/.github/actions/minver@5e0bd6d05eb07c7ee0bb7930596d9d38dc6e0070 # main
      with:
        tag-prefix: ''
        version-override: ${{ inputs.versionOverride != '' && inputs.versionOverride || steps.bump.outputs.version }}

  package-windows:
    name: Package Windows (${{ needs.version.outputs.semver2 }})
    needs: version
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.version.outputs.sourceSha }}
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@5e0bd6d05eb07c7ee0bb7930596d9d38dc6e0070 # main
      with:
        dotnet-versions: |
          11.0.100-rc.1.26425.128
        stamp-version: 'false'
    - name: Build release tools
      run: dotnet publish tools/PdfViewerLite.Tools/PdfViewerLite.Tools.csproj -c Release --self-contained false -o artifacts/tools
    - name: Publish Windows Native AOT
      run: dotnet artifacts/tools/PdfViewerLite.Tools.dll publish win-x64 ${{ needs.version.outputs.semver2 }}
    - name: Package Windows (MSIX, MSI, ZIP)
      run: dotnet artifacts/tools/PdfViewerLite.Tools.dll package windows win-x64 ${{ needs.version.outputs.semver2 }}
    - name: Upload unsigned Windows packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: unsigned-windows
        path: |
          artifacts/pdfviewerlite-*.msix
          artifacts/pdfviewerlite-*.msi
          artifacts/pdfviewerlite-*.zip
        if-no-files-found: error

  sign:
    name: Sign and verify all release assets (${{ needs.version.outputs.semver2 }})
    needs: [version, package-windows, package-linux, package-macos]
    runs-on: ubuntu-26.04
    environment:
      name: release
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/reactiveui/certum-signer:latest@sha256:a609cf99c5bdb673fa7b1e48c2dd6c3b0a559377a0278f673889f3b2f4ebe6ce
      options: --volume /home/runner/work/_actions:/home/runner/work/_actions:ro
    env:
      PKCS11_PROVIDER: /usr/lib/x86_64-linux-gnu/ossl-modules/pkcs11prov.so
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.version.outputs.sourceSha }}
    - name: Build release tools
      run: dotnet publish tools/PdfViewerLite.Tools/PdfViewerLite.Tools.csproj -c Release --self-contained false -o artifacts/tools
    - name: Download all release packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: unsigned-*
        merge-multiple: true
        path: signed
    - name: Connect SimplySign
      uses: glennawatson/actions-common/.github/actions/certum-connect@5e0bd6d05eb07c7ee0bb7930596d9d38dc6e0070 # main
    - name: Sign and verify Windows payloads and installers
      id: authenticode
      uses: glennawatson/actions-common/.github/actions/sign-authenticode@5e0bd6d05eb07c7ee0bb7930596d9d38dc6e0070 # main
      with:
        tools-assembly: artifacts/tools/PdfViewerLite.Tools.dll
        packages-glob: 'signed/*'
    - name: Sign and verify detached archive signatures
      uses: glennawatson/actions-common/.github/actions/sign-detached@5e0bd6d05eb07c7ee0bb7930596d9d38dc6e0070 # main
      with:
        tools-assembly: artifacts/tools/PdfViewerLite.Tools.dll
        packages-glob: 'signed/*'
        certificate-source: ${{ steps.authenticode.outputs.certificate-source }}
    - name: Upload verified release assets
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: signed-release-assets
        path: signed/*
        if-no-files-found: error

  package-linux:
    name: Package ${{ matrix.rid }} (${{ needs.version.outputs.semver2 }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
        - rid: linux-x64
          runner: ubuntu-26.04
        - rid: linux-arm64
          runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.version.outputs.sourceSha }}
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@5e0bd6d05eb07c7ee0bb7930596d9d38dc6e0070 # main
      with:
        dotnet-versions: |
          11.0.100-rc.1.26425.128
        stamp-version: 'false'
    - name: Build release tools
      run: dotnet publish tools/PdfViewerLite.Tools/PdfViewerLite.Tools.csproj -c Release --self-contained false -o artifacts/tools
    - name: Publish Linux Native AOT
      run: dotnet artifacts/tools/PdfViewerLite.Tools.dll publish ${{ matrix.rid }} ${{ needs.version.outputs.semver2 }}
    - name: Package Linux (AppImage, DEB, RPM, tar.gz)
      run: dotnet artifacts/tools/PdfViewerLite.Tools.dll package linux ${{ matrix.rid }} ${{ needs.version.outputs.semver2 }}
    - name: Upload Linux packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: unsigned-${{ matrix.rid }}
        path: |
          artifacts/PdfViewerLite-*.AppImage
          artifacts/*.deb
          artifacts/*.rpm
          artifacts/pdfviewerlite-*.tar.gz
        if-no-files-found: error

  package-macos:
    name: Package macOS (${{ needs.version.outputs.semver2 }})
    needs: version
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.version.outputs.sourceSha }}
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@5e0bd6d05eb07c7ee0bb7930596d9d38dc6e0070 # main
      with:
        dotnet-versions: |
          11.0.100-rc.1.26425.128
        stamp-version: 'false'
    - name: Build release tools
      run: dotnet publish tools/PdfViewerLite.Tools/PdfViewerLite.Tools.csproj -c Release --self-contained false -o artifacts/tools
    - name: Publish macOS Native AOT
      run: dotnet artifacts/tools/PdfViewerLite.Tools.dll publish osx-arm64 ${{ needs.version.outputs.semver2 }}
    - name: Package macOS (.app, DMG, ZIP)
      run: dotnet artifacts/tools/PdfViewerLite.Tools.dll package macos osx-arm64 ${{ needs.version.outputs.semver2 }}
    - name: Upload macOS packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: unsigned-macos
        path: |
          artifacts/pdfviewerlite-*.dmg
          artifacts/pdfviewerlite-*.app.zip
        if-no-files-found: error

  create-release:
    name: Create release (${{ needs.version.outputs.semver2 }})
    needs: [version, sign]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.version.outputs.sourceSha }}
        fetch-depth: 0
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@5e0bd6d05eb07c7ee0bb7930596d9d38dc6e0070 # main
      with:
        dotnet-versions: |
          11.0.100-rc.1.26425.128
        stamp-version: 'false'
    - name: Build release tools
      run: dotnet publish tools/PdfViewerLite.Tools/PdfViewerLite.Tools.csproj -c Release --self-contained false -o artifacts/tools
    - name: Download signed release assets
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: signed-release-assets
        path: release-assets
    - name: Generate release notes
      env:
        GITHUB_TOKEN: ${{ github.token }}
        RELEASE_VERSION: ${{ needs.version.outputs.semver2 }}
        SOURCE_SHA: ${{ needs.version.outputs.sourceSha }}
      run: dotnet artifacts/tools/PdfViewerLite.Tools.dll release-notes "$RELEASE_VERSION" "$SOURCE_SHA" release-notes.md
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        TAG: ${{ needs.version.outputs.tag }}
        TARGET: ${{ needs.version.outputs.sourceSha }}
        TITLE: ${{ needs.version.outputs.semver2 }}
        PRERELEASE: ${{ needs.version.outputs.prerelease }}
      shell: bash
      run: |
        flags=()
        if [ "$PRERELEASE" = "true" ]; then
          flags+=(--prerelease)
        fi
        gh release create "$TAG" \
          --repo "$REPO" \
          --target "$TARGET" \
          --title "$TITLE" \
          --notes-file release-notes.md \
          "${flags[@]}" \
          release-assets/*
