name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Release level for the new tag.'
        required: true
        type: choice
        options:
        - major
        - minor
        - patch
      preRelease:
        description: 'Pre-release channel (e.g. beta, rc). Empty = stable release.'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      prerelease: ${{ steps.bump.outputs.prerelease }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@952c87a450f5e4f2d6d52f8198e1c04a577008f5 # main
      with:
        src-folder: '.'
        stamp-version: 'false'
    - name: Compute version and tag
      id: bump
      uses: glennawatson/actions-common/.github/actions/compute-version-and-tag@952c87a450f5e4f2d6d52f8198e1c04a577008f5 # main
      with:
        bump: ${{ inputs.bump }}
        tag-prefix: ''
        pre-release-id: ${{ inputs.preRelease }}
        push-tag: 'false'

  build:
    name: Build and test
    needs: version
    uses: glennawatson/actions-common/.github/workflows/workflow-common-setup-and-build.yml@952c87a450f5e4f2d6d52f8198e1c04a577008f5 # main
    with:
      srcFolder: '.'
      solutionFile: PdfViewerLite.slnx
      minverTagPrefix: ''
      uploadCodecov: false
      dotnetVersions: |
        10.x
        11.x

  publish-windows:
    name: Publish Windows (${{ needs.version.outputs.version }})
    needs: [version, build]
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@952c87a450f5e4f2d6d52f8198e1c04a577008f5 # main
      with:
        src-folder: '.'
        stamp-version: 'false'
        dotnet-versions: |
          10.x
          11.x
    - name: Build release tools
      run: dotnet publish tools/PdfViewerLite.Tools/PdfViewerLite.Tools.csproj -c Release --self-contained false -o artifacts/tools
    - name: Publish Windows Native AOT
      run: dotnet artifacts/tools/PdfViewerLite.Tools.dll publish win-x64 ${{ needs.version.outputs.version }}
    - name: Upload the published app
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-app
        path: artifacts/win-x64
        if-no-files-found: error

  sign-windows-app:
    name: Sign the Windows app
    needs: publish-windows
    runs-on: ubuntu-latest
    environment:
      name: release
    container:
      image: ghcr.io/reactiveui/certum-signer:latest@sha256:05d52b46c5e62769146f37aae308127ec1d74cfb1209261e35334eaac700dcac
    env:
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}
    steps:
    - name: Download the published app
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: windows-app
        path: signed
    - name: Sign the executable with jsign
      uses: glennawatson/actions-common/.github/actions/certum-sign@952c87a450f5e4f2d6d52f8198e1c04a577008f5 # main
      with:
        packages-glob: 'signed/pdfviewerlite.exe'
        target-type: authenticode
    - name: Upload the signed app
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-app-signed
        path: signed
        if-no-files-found: error

  package-windows:
    name: Package Windows (${{ needs.version.outputs.version }})
    needs: [version, sign-windows-app]
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@952c87a450f5e4f2d6d52f8198e1c04a577008f5 # main
      with:
        src-folder: '.'
        stamp-version: 'false'
    - name: Build release tools
      run: dotnet publish tools/PdfViewerLite.Tools/PdfViewerLite.Tools.csproj -c Release --self-contained false -o artifacts/tools
    - name: Download the signed app
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: windows-app-signed
        path: artifacts/win-x64
    - name: Package Windows (MSIX, MSI, ZIP)
      run: dotnet artifacts/tools/PdfViewerLite.Tools.dll package windows win-x64 ${{ needs.version.outputs.version }}
    - name: Upload Windows packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-packages
        path: |
          artifacts/pdfviewerlite-*.msix
          artifacts/pdfviewerlite-*.msi
          artifacts/pdfviewerlite-*.zip
        if-no-files-found: error

  sign-windows-installers:
    name: Sign the Windows installers
    needs: package-windows
    runs-on: ubuntu-latest
    environment:
      name: release
    container:
      image: ghcr.io/reactiveui/certum-signer:latest@sha256:05d52b46c5e62769146f37aae308127ec1d74cfb1209261e35334eaac700dcac
    env:
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}
    steps:
    - name: Download the Windows packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: windows-packages
        path: signed
    - name: Sign the MSI and MSIX with jsign
      uses: glennawatson/actions-common/.github/actions/certum-sign@952c87a450f5e4f2d6d52f8198e1c04a577008f5 # main
      with:
        packages-glob: 'signed/*.msi*'
        target-type: authenticode
    - name: Upload the signed Windows packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-windows
        path: signed/*
        if-no-files-found: error

  package-linux:
    name: Package ${{ matrix.rid }} (${{ needs.version.outputs.version }})
    needs: [version, build]
    strategy:
      fail-fast: false
      matrix:
        include:
        - rid: linux-x64
          runner: ubuntu-latest
        - rid: linux-arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@952c87a450f5e4f2d6d52f8198e1c04a577008f5 # main
      with:
        src-folder: '.'
        stamp-version: 'false'
        dotnet-versions: |
          10.x
          11.x
    - name: Build release tools
      run: dotnet publish tools/PdfViewerLite.Tools/PdfViewerLite.Tools.csproj -c Release --self-contained false -o artifacts/tools
    - name: Publish Linux Native AOT
      run: dotnet artifacts/tools/PdfViewerLite.Tools.dll publish ${{ matrix.rid }} ${{ needs.version.outputs.version }}
    - name: Package Linux (AppImage, DEB, RPM, tar.gz)
      run: dotnet artifacts/tools/PdfViewerLite.Tools.dll package linux ${{ matrix.rid }} ${{ needs.version.outputs.version }}
    - name: Upload Linux packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: linux-${{ matrix.rid }}
        path: |
          artifacts/PdfViewerLite-*.AppImage
          artifacts/*.deb
          artifacts/*.rpm
          artifacts/pdfviewerlite-*.tar.gz
        if-no-files-found: error

  sign-linux:
    name: Sign the RPM files
    needs: package-linux
    runs-on: ubuntu-latest
    environment:
      name: release
    container:
      image: ghcr.io/reactiveui/certum-signer:latest@sha256:05d52b46c5e62769146f37aae308127ec1d74cfb1209261e35334eaac700dcac
    env:
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
    steps:
    - name: Download the Linux packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: linux-*
        merge-multiple: true
        path: signed
    - name: Sign the files in each RPM
      uses: glennawatson/actions-common/.github/actions/certum-rpm-sign@952c87a450f5e4f2d6d52f8198e1c04a577008f5 # main
      with:
        packages-glob: 'signed/*.rpm'
    - name: Upload the Linux packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-linux
        path: signed/*
        if-no-files-found: error

  package-macos:
    name: Package macOS (${{ needs.version.outputs.version }})
    needs: [version, build]
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@952c87a450f5e4f2d6d52f8198e1c04a577008f5 # main
      with:
        src-folder: '.'
        stamp-version: 'false'
        dotnet-versions: |
          10.x
          11.x
    - name: Build release tools
      run: dotnet publish tools/PdfViewerLite.Tools/PdfViewerLite.Tools.csproj -c Release --self-contained false -o artifacts/tools
    - name: Publish macOS Native AOT
      run: dotnet artifacts/tools/PdfViewerLite.Tools.dll publish osx-arm64 ${{ needs.version.outputs.version }}
    - name: Package macOS (.app, DMG, ZIP)
      run: dotnet artifacts/tools/PdfViewerLite.Tools.dll package macos osx-arm64 ${{ needs.version.outputs.version }}
    - name: Upload macOS packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-macos
        path: |
          artifacts/pdfviewerlite-*.dmg
          artifacts/pdfviewerlite-*.app.zip
        if-no-files-found: error

  aur:
    name: Write the AUR package files
    needs: [version, sign-linux]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@952c87a450f5e4f2d6d52f8198e1c04a577008f5 # main
      with:
        src-folder: '.'
        stamp-version: 'false'
    - name: Build release tools
      run: dotnet publish tools/PdfViewerLite.Tools/PdfViewerLite.Tools.csproj -c Release --self-contained false -o artifacts/tools
    - name: Download the Linux packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-linux
        path: linux
    - name: Write the AUR PKGBUILD and .SRCINFO
      run: dotnet artifacts/tools/PdfViewerLite.Tools.dll package aur ${{ needs.version.outputs.version }} linux artifacts/aur
    - name: Upload the AUR package files
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-aur
        path: artifacts/aur
        include-hidden-files: true
        if-no-files-found: error

  collect:
    name: Collect the release files
    needs: [sign-windows-installers, sign-linux, package-macos, aur]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Merge the release files into one artifact
      uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-assets
        pattern: release-*
        include-hidden-files: true

  release:
    name: Create release (${{ needs.version.outputs.version }})
    needs: [version, collect]
    permissions:
      contents: write
    uses: glennawatson/actions-common/.github/workflows/workflow-common-create-release.yml@952c87a450f5e4f2d6d52f8198e1c04a577008f5 # main
    with:
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
      artifactName: release-assets
      assetGlob: '*'
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
