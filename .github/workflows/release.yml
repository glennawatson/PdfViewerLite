name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Release level for the new tag.'
        required: true
        type: choice
        options:
        - major
        - minor
        - patch
      preRelease:
        description: 'Pre-release channel (e.g. beta, rc). Empty = stable release.'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      prerelease: ${{ steps.bump.outputs.prerelease }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        src-folder: '.'
        stamp-version: 'false'
        dotnet-versions: |
          11.x
    - name: Compute version and tag
      id: bump
      uses: glennawatson/actions-common/.github/actions/compute-version-and-tag@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        bump: ${{ inputs.bump }}
        tag-prefix: ''
        pre-release-id: ${{ inputs.preRelease }}
        push-tag: 'false'

  # Native AOT cannot cross-compile, so each operating system publishes its own build.
  publish-windows:
    name: Publish ${{ matrix.rid }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
        - rid: win-x64
          runner: windows-latest
        - rid: win-arm64
          runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      RID: ${{ matrix.rid }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        src-folder: '.'
        stamp-version: 'false'
        dotnet-versions: |
          10.x
          11.x
    - name: Publish Native AOT
      run: dotnet publish src/PdfViewerLite.App/PdfViewerLite.App.csproj -c Release -f net10.0 -r "$RID" -o "artifacts/$RID" "-p:Version=$VERSION" "-p:MinVerVersionOverride=$VERSION"
    - name: Upload the published app
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: app-${{ matrix.rid }}
        path: artifacts/${{ matrix.rid }}
        if-no-files-found: error

  # Publishing and packaging share a job so the Unix file modes survive; artifacts drop them.
  package-linux:
    name: Package ${{ matrix.rid }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
        - rid: linux-x64
          runner: ubuntu-latest
          deb-architecture: amd64
          rpm-architecture: x86_64
        - rid: linux-arm64
          runner: ubuntu-24.04-arm
          deb-architecture: arm64
          rpm-architecture: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      RID: ${{ matrix.rid }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        src-folder: '.'
        stamp-version: 'false'
        dotnet-versions: |
          10.x
          11.x
    - name: Publish Native AOT
      run: dotnet publish src/PdfViewerLite.App/PdfViewerLite.App.csproj -c Release -f net10.0 -r "$RID" -o "artifacts/$RID" "-p:Version=$VERSION" "-p:MinVerVersionOverride=$VERSION"
    - name: Stage the installed tree
      run: |
        mkdir -p artifacts/stage/usr/lib artifacts/stage/usr/bin artifacts/stage/usr/share/licenses/pdfviewerlite
        cp -R "artifacts/$RID" artifacts/stage/usr/lib/pdfviewerlite
        ln -s /usr/lib/pdfviewerlite/pdfviewerlite artifacts/stage/usr/bin/pdfviewerlite
        cp LICENSE artifacts/stage/usr/share/licenses/pdfviewerlite/LICENSE
    - name: Stage the desktop integration
      run: |
        mkdir -p artifacts/stage/usr/share/applications artifacts/stage/usr/share/metainfo artifacts/stage/usr/share/icons
        cp packaging/linux/net.glennwatson.PdfViewerLite.desktop artifacts/stage/usr/share/applications/
        cp packaging/linux/net.glennwatson.PdfViewerLite.metainfo.xml artifacts/stage/usr/share/metainfo/
        cp -R packaging/linux/icons/hicolor artifacts/stage/usr/share/icons/hicolor
    - name: Stage the AppDir
      run: |
        mkdir -p artifacts/appdir/usr/share/applications artifacts/appdir/usr/share/metainfo artifacts/appdir/usr/share/icons
        cp -R "artifacts/$RID" artifacts/appdir/usr/bin
        ln -s usr/bin/pdfviewerlite artifacts/appdir/AppRun
        cp -R packaging/linux/icons/hicolor artifacts/appdir/usr/share/icons/hicolor
    - name: Stage the AppDir desktop entry and icon
      run: |
        cp packaging/linux/net.glennwatson.PdfViewerLite.desktop artifacts/appdir/
        cp packaging/linux/net.glennwatson.PdfViewerLite.desktop artifacts/appdir/usr/share/applications/
        cp packaging/linux/icons/hicolor/256x256/apps/net.glennwatson.PdfViewerLite.png artifacts/appdir/
        ln -s net.glennwatson.PdfViewerLite.png artifacts/appdir/.DirIcon
    - name: Stage the AppDir metadata
      run: cp packaging/linux/net.glennwatson.PdfViewerLite.metainfo.xml artifacts/appdir/usr/share/metainfo/net.glennwatson.PdfViewerLite.appdata.xml
    - name: Build the RPM
      uses: glennawatson/actions-common/.github/actions/rpm-build@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        source: artifacts/stage
        output: artifacts/pdfviewerlite-${{ needs.version.outputs.version }}-1.${{ matrix.rpm-architecture }}.rpm
        name: pdfviewerlite
        version: ${{ needs.version.outputs.version }}
        architecture: ${{ matrix.rpm-architecture }}
        summary: Fast, tabbed PDF viewer
        description: |
          Renders with PDFium, follows the KDE colour scheme and opens documents launched
          from the file manager as tabs in the running window.
        license: MIT
        url: https://github.com/glennawatson/PdfViewerLite
        vendor: Glenn Watson
        requires: |
          fontconfig
          libX11
          libICE
          libSM
        recommends: |
          libwayland-client
          libxkbcommon
          mesa-libEGL
          cups-libs
          pulseaudio-libs
        owned-directories: |
          /usr/lib/pdfviewerlite
          /usr/share/licenses/pdfviewerlite
    - name: Build the DEB
      uses: glennawatson/actions-common/.github/actions/deb-build@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        source: artifacts/stage
        output: artifacts/pdfviewerlite_${{ needs.version.outputs.version }}_${{ matrix.deb-architecture }}.deb
        name: pdfviewerlite
        version: ${{ needs.version.outputs.version }}
        architecture: ${{ matrix.deb-architecture }}
        maintainer: Glenn Watson
        summary: Fast, tabbed PDF viewer
        description: |
          Renders with PDFium, follows the KDE colour scheme and opens documents launched
          from the file manager as tabs in the running window.
        homepage: https://github.com/glennawatson/PdfViewerLite
        section: graphics
        depends: |
          libfontconfig1 | fontconfig
          libx11-6 | libX11
          libice6 | libICE
          libsm6 | libSM
        recommends: |
          libwayland-client0
          libxkbcommon0
          libegl1
          libcups2
          libpulse0
    - name: Build the AppImage
      uses: glennawatson/actions-common/.github/actions/appimage-build@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        appdir: artifacts/appdir
        architecture: ${{ matrix.rpm-architecture }}
        output: artifacts/PdfViewerLite-${{ needs.version.outputs.version }}-${{ matrix.rpm-architecture }}.AppImage
    - name: Build the tar.gz
      run: tar -czf "artifacts/pdfviewerlite-$VERSION-$RID.tar.gz" -C artifacts "$RID"
    - name: Upload the Linux packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: packages-${{ matrix.rid }}
        path: |
          artifacts/PdfViewerLite-*.AppImage
          artifacts/pdfviewerlite_*.deb
          artifacts/pdfviewerlite-*.rpm
          artifacts/pdfviewerlite-*.tar.gz
        if-no-files-found: error

  # Publishing and packaging share a job so the Unix file modes survive; artifacts drop them.
  package-macos:
    name: Package ${{ matrix.rid }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    runs-on: macos-latest
    env:
      RID: ${{ matrix.rid }}
      VERSION: ${{ needs.version.outputs.version }}
      APP: artifacts/macos-${{ matrix.rid }}.noindex/Hyper PDF Viewer.app
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        src-folder: '.'
        stamp-version: 'false'
        dotnet-versions: |
          10.x
          11.x
    - name: Publish Native AOT
      run: dotnet publish src/PdfViewerLite.App/PdfViewerLite.App.csproj -c Release -f net10.0 -r "$RID" -o "artifacts/$RID" "-p:Version=$VERSION" "-p:MinVerVersionOverride=$VERSION"
    # The .noindex folder stops Spotlight holding files open while the image is built.
    - name: Lay out the app bundle
      uses: glennawatson/actions-common/.github/actions/macos-app-bundle@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        source: artifacts/${{ matrix.rid }}
        output: artifacts/macos-${{ matrix.rid }}.noindex/Hyper PDF Viewer.app
        name: Hyper PDF Viewer
        bundle-identifier: net.glennwatson.PdfViewerLite
        version: ${{ needs.version.outputs.version }}
        executable: pdfviewerlite
        icon: packaging/macos/PdfViewerLite.icns
        minimum-system-version: '12.0'
        document-types: 'com.adobe.pdf: Viewer: PDF Document'
        category: public.app-category.productivity
        copyright: Copyright (c) 2026 Glenn Watson. MIT licensed.
    # Contents/MacOS holds only code to sign; the app also looks for its text recognition data in Contents/Resources.
    - name: Move the text recognition data to Resources
      run: mv "$APP/Contents/MacOS/tessdata" "$APP/Contents/Resources/tessdata"
    - name: Sign the app bundle (ad hoc)
      run: codesign --force --deep --sign - "$APP"
    - name: Build the DMG
      uses: glennawatson/actions-common/.github/actions/dmg-build@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        source: artifacts/macos-${{ matrix.rid }}.noindex
        volume-name: Hyper PDF Viewer
        output: artifacts/pdfviewerlite-${{ needs.version.outputs.version }}-${{ matrix.rid }}.dmg
    - name: Build the app zip
      run: tar -a -cf "artifacts/pdfviewerlite-$VERSION-$RID.app.zip" -C "artifacts/macos-$RID.noindex" "Hyper PDF Viewer.app"
    - name: Upload the macOS packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: packages-${{ matrix.rid }}
        path: |
          artifacts/pdfviewerlite-*.dmg
          artifacts/pdfviewerlite-*.app.zip
        if-no-files-found: error

  # One Linux job signs in to the token once and signs everything. The Windows installers are built here so they
  # hold the signed executables.
  sign:
    name: Sign everything
    needs: [version, publish-windows, package-linux, package-macos]
    runs-on: ubuntu-latest
    environment:
      name: release
    container:
      image: ghcr.io/reactiveui/certum-signer:latest@sha256:05d52b46c5e62769146f37aae308127ec1d74cfb1209261e35334eaac700dcac
    env:
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        src-folder: '.'
        stamp-version: 'false'
        dotnet-versions: |
          11.x
    - name: Download the x64 Windows app
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: app-win-x64
        path: artifacts/win-x64
    - name: Download the ARM64 Windows app
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: app-win-arm64
        path: artifacts/win-arm64
    - name: Download the Linux and macOS packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: packages-*
        merge-multiple: true
        path: release
    # certum-sign matches wildcards in file names only, so both executables share one folder while they are signed.
    - name: Gather the executables
      run: |
        mkdir -p artifacts/exe
        mv artifacts/win-x64/pdfviewerlite.exe artifacts/exe/pdfviewerlite-win-x64.exe
        mv artifacts/win-arm64/pdfviewerlite.exe artifacts/exe/pdfviewerlite-win-arm64.exe
    - name: Sign the executables and RPMs
      uses: glennawatson/actions-common/.github/actions/certum-sign@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        authenticode: 'artifacts/exe/*.exe'
        rpm: 'release/*.rpm'
    - name: Return the executables
      run: |
        mv artifacts/exe/pdfviewerlite-win-x64.exe artifacts/win-x64/pdfviewerlite.exe
        mv artifacts/exe/pdfviewerlite-win-arm64.exe artifacts/win-arm64/pdfviewerlite.exe
    - name: Stage the MSIX payloads
      run: |
        cp -R artifacts/win-x64 artifacts/msix-win-x64
        cp -R artifacts/win-arm64 artifacts/msix-win-arm64
        cp LICENSE artifacts/msix-win-x64/LICENSE
        cp LICENSE artifacts/msix-win-arm64/LICENSE
    - name: Add the MSIX logos
      run: |
        mkdir -p artifacts/msix-win-x64/Assets
        cp packaging/linux/icons/hicolor/48x48/apps/net.glennwatson.PdfViewerLite.png artifacts/msix-win-x64/Assets/Square44x44Logo.png
        cp packaging/linux/icons/hicolor/256x256/apps/net.glennwatson.PdfViewerLite.png artifacts/msix-win-x64/Assets/Square150x150Logo.png
        cp packaging/linux/icons/hicolor/48x48/apps/net.glennwatson.PdfViewerLite.png artifacts/msix-win-x64/Assets/StoreLogo.png
    - name: Add the ARM64 MSIX logos
      run: cp -R artifacts/msix-win-x64/Assets artifacts/msix-win-arm64/Assets
    - name: Build the x64 MSIX
      uses: glennawatson/actions-common/.github/actions/msix-build@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        source: artifacts/msix-win-x64
        output: release/pdfviewerlite-${{ needs.version.outputs.version }}-win-x64.msix
        identity-name: net.glennwatson.PdfViewerLite
        publisher: 'CN=Glenn Andrew Watson, O=Glenn Andrew Watson, L=Mooroolbark, S=Victoria, C=AU'
        version: ${{ needs.version.outputs.version }}
        architecture: x64
        display-name: Hyper PDF Viewer
        publisher-display-name: Glenn Watson
        description: A calm PDF viewer
        executable: pdfviewerlite.exe
        application-id: PdfViewerLite
        square44-logo: Assets/Square44x44Logo.png
        square150-logo: Assets/Square150x150Logo.png
        store-logo: Assets/StoreLogo.png
        min-version: 10.0.19041.0
        file-types: .pdf
        file-type-name: PDF document
    - name: Build the ARM64 MSIX
      uses: glennawatson/actions-common/.github/actions/msix-build@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        source: artifacts/msix-win-arm64
        output: release/pdfviewerlite-${{ needs.version.outputs.version }}-win-arm64.msix
        identity-name: net.glennwatson.PdfViewerLite
        publisher: 'CN=Glenn Andrew Watson, O=Glenn Andrew Watson, L=Mooroolbark, S=Victoria, C=AU'
        version: ${{ needs.version.outputs.version }}
        architecture: arm64
        display-name: Hyper PDF Viewer
        publisher-display-name: Glenn Watson
        description: A calm PDF viewer
        executable: pdfviewerlite.exe
        application-id: PdfViewerLite
        square44-logo: Assets/Square44x44Logo.png
        square150-logo: Assets/Square150x150Logo.png
        store-logo: Assets/StoreLogo.png
        min-version: 10.0.19041.0
        file-types: .pdf
        file-type-name: PDF document
    - name: Build the x64 MSI
      uses: glennawatson/actions-common/.github/actions/msi-build@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        source: artifacts/win-x64
        output: release/pdfviewerlite-${{ needs.version.outputs.version }}-win-x64.msi
        product-name: Hyper PDF Viewer
        manufacturer: Glenn Watson
        version: ${{ needs.version.outputs.version }}
        upgrade-code: '{0C547842-7023-455E-9807-E4C0CA332DA8}'
        architecture: x64
        install-folder: 'Glenn Watson\Hyper PDF Viewer'
        executable: pdfviewerlite.exe
        icon: packaging/windows/PdfViewerLite.ico
        homepage: https://github.com/glennawatson/PdfViewerLite
    - name: Build the ARM64 MSI
      uses: glennawatson/actions-common/.github/actions/msi-build@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        source: artifacts/win-arm64
        output: release/pdfviewerlite-${{ needs.version.outputs.version }}-win-arm64.msi
        product-name: Hyper PDF Viewer
        manufacturer: Glenn Watson
        version: ${{ needs.version.outputs.version }}
        upgrade-code: '{0C547842-7023-455E-9807-E4C0CA332DA8}'
        architecture: arm64
        install-folder: 'Glenn Watson\Hyper PDF Viewer'
        executable: pdfviewerlite.exe
        icon: packaging/windows/PdfViewerLite.ico
        homepage: https://github.com/glennawatson/PdfViewerLite
    - name: Zip the x64 app
      uses: glennawatson/actions-common/.github/actions/zip-build@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        source: artifacts/win-x64
        output: release/pdfviewerlite-${{ needs.version.outputs.version }}-win-x64.zip
    - name: Zip the ARM64 app
      uses: glennawatson/actions-common/.github/actions/zip-build@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        source: artifacts/win-arm64
        output: release/pdfviewerlite-${{ needs.version.outputs.version }}-win-arm64.zip
    - name: Write the AUR PKGBUILD and .SRCINFO
      uses: glennawatson/actions-common/.github/actions/aur-build@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        debs: release
        name: pdfviewerlite-bin
        version: ${{ needs.version.outputs.version }}
        description: Fast, tabbed PDF viewer
        url: https://github.com/glennawatson/PdfViewerLite
        license: MIT
        depends: |
          fontconfig
          libx11
          libice
          libsm
          gcc-libs
          glibc
        optdepends: |
          wayland: native Wayland support
          libxkbcommon: Wayland keyboard input
          libegl: native Wayland rendering
          libcups: print straight to a printer
          libpulse: Read Aloud sound through PulseAudio or PipeWire
        maintainer: Glenn Watson
        source-url-template: https://github.com/glennawatson/PdfViewerLite/releases/download/${{ needs.version.outputs.tag }}/{file}
        output: release
    - name: Sign the installers and the checksums
      uses: glennawatson/actions-common/.github/actions/certum-sign@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        authenticode: 'release/*.msi*'
        checksums: 'release/*'
        certificate-from: release/pdfviewerlite-${{ needs.version.outputs.version }}-win-x64.msi
    - name: Upload the release files
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-assets
        path: release
        include-hidden-files: true
        if-no-files-found: error

  verify-linux:
    name: Verify ${{ matrix.rid }} DEB and AppImage
    needs: [version, sign]
    strategy:
      fail-fast: false
      matrix:
        include:
        - rid: linux-x64
          runner: ubuntu-latest
          deb-architecture: amd64
          architecture: x86_64
        - rid: linux-arm64
          runner: ubuntu-24.04-arm
          deb-architecture: arm64
          architecture: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Download the release files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-assets
        path: packages
    - name: Verify the DEB
      uses: glennawatson/actions-common/.github/actions/deb-verify@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        package: packages/pdfviewerlite_${{ needs.version.outputs.version }}_${{ matrix.deb-architecture }}.deb
        name: pdfviewerlite
        expect-files: |
          /usr/bin/pdfviewerlite
          /usr/lib/pdfviewerlite/pdfviewerlite
          /usr/share/applications/net.glennwatson.PdfViewerLite.desktop
          /usr/share/metainfo/net.glennwatson.PdfViewerLite.metainfo.xml
    - name: Verify the AppImage
      uses: glennawatson/actions-common/.github/actions/appimage-verify@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        package: packages/PdfViewerLite-${{ needs.version.outputs.version }}-${{ matrix.architecture }}.AppImage

  verify-rpm:
    name: Verify ${{ matrix.rid }} RPM
    needs: [version, sign]
    strategy:
      fail-fast: false
      matrix:
        include:
        - rid: linux-x64
          runner: ubuntu-latest
          architecture: x86_64
        - rid: linux-arm64
          runner: ubuntu-24.04-arm
          architecture: aarch64
    runs-on: ${{ matrix.runner }}
    container: fedora:latest@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
    - name: Download the release files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-assets
        path: packages
    - name: Verify the RPM
      uses: glennawatson/actions-common/.github/actions/rpm-verify@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        package: packages/pdfviewerlite-${{ needs.version.outputs.version }}-1.${{ matrix.architecture }}.rpm
        name: pdfviewerlite
        expect-files: |
          /usr/bin/pdfviewerlite
          /usr/lib/pdfviewerlite/pdfviewerlite
          /usr/share/applications/net.glennwatson.PdfViewerLite.desktop
          /usr/share/metainfo/net.glennwatson.PdfViewerLite.metainfo.xml

  verify-windows:
    name: Verify ${{ matrix.rid }} MSI and MSIX
    needs: [version, sign]
    strategy:
      fail-fast: false
      matrix:
        include:
        - rid: win-x64
          runner: windows-latest
        - rid: win-arm64
          runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Download the release files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-assets
        path: packages
    - name: Verify the MSI
      uses: glennawatson/actions-common/.github/actions/msi-verify@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        # msiexec reads a forward slash as an invalid path character (error 1324), so this path uses a backslash.
        package: packages\pdfviewerlite-${{ needs.version.outputs.version }}-${{ matrix.rid }}.msi
        expect-files: |
          %ProgramFiles%\Glenn Watson\Hyper PDF Viewer\pdfviewerlite.exe
    - name: Verify the MSIX
      uses: glennawatson/actions-common/.github/actions/msix-verify@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        package: packages/pdfviewerlite-${{ needs.version.outputs.version }}-${{ matrix.rid }}.msix
        identity-name: net.glennwatson.PdfViewerLite
        executable: pdfviewerlite.exe

  verify-macos:
    name: Verify ${{ matrix.rid }} DMG
    needs: [version, sign]
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    runs-on: macos-latest
    steps:
    - name: Download the release files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-assets
        path: packages
    - name: Verify the DMG
      uses: glennawatson/actions-common/.github/actions/dmg-verify@b824c637960b1886a6a30a2526856bbf017661cf # main
      with:
        package: packages/pdfviewerlite-${{ needs.version.outputs.version }}-${{ matrix.rid }}.dmg
        app: Hyper PDF Viewer.app
        signed: 'true'

  release:
    name: Create release (${{ needs.version.outputs.version }})
    needs: [version, verify-linux, verify-rpm, verify-windows, verify-macos]
    permissions:
      contents: write
    uses: glennawatson/actions-common/.github/workflows/workflow-common-create-release.yml@b824c637960b1886a6a30a2526856bbf017661cf # main
    with:
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
      artifactName: release-assets
      assetGlob: '*'
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
