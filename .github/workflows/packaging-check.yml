name: Packaging check
on:
  pull_request:
    branches: [main]
    paths:
    - '.github/workflows/**'
    - 'tools/packaging/**'
    - 'tools/ci/**'
    - 'packaging/**'
    - 'Directory.*.props'
    - 'global.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packaging-check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package:
    name: Package ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - rid: win-x64
          runner: windows-latest
          script: windows
        - rid: osx-arm64
          runner: macos-latest
          script: macos
        - rid: linux-x64
          runner: ubuntu-26.04
          script: linux
        - rid: linux-arm64
          runner: ubuntu-26.04-arm
          script: linux
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up .NET
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@6733191524ed33a2633e0f24b9c2601e44069715 # main
      with:
        dotnet-versions: |
          11.0.100-rc.1.26425.128
        stamp-version: 'false'
    - name: Prepare Linux packaging
      if: runner.os == 'Linux'
      run: dotnet run --file tools/ci/prepare.cs -- package
    - name: Publish Native AOT
      run: dotnet run --file tools/packaging/publish.cs -- ${{ matrix.rid }} 1.0.0
    - name: Build packages
      run: dotnet run --file tools/packaging/${{ matrix.script }}.cs -- ${{ matrix.rid }} 1.0.0
    - name: Upload packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: packaging-check-${{ matrix.rid }}
        path: |
          artifacts/PdfViewerLite-*.AppImage
          artifacts/pdfviewerlite*.deb
          artifacts/pdfviewerlite-*.rpm
          artifacts/pdfviewerlite-*.tar.gz
          artifacts/pdfviewerlite-*.msix
          artifacts/pdfviewerlite-*.msi
          artifacts/pdfviewerlite-*.zip
          artifacts/pdfviewerlite-*.dmg
        if-no-files-found: error
