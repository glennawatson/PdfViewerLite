name: Cross-platform tests

# Runs the whole test suite on Linux, Windows and macOS, real PDFs and real voices included, so the same documents are
# shown to open, navigate, search, annotate, fill, sign, save, print, reflow and read aloud on each platform.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json
      # The processor decides which int8 kernels ONNX Runtime uses for the voices, so record it with the results.
      - name: Show the processor
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) lscpu | grep 'Model name'; grep -ow 'avx512_vnni\|avx_vnni\|avx2' /proc/cpuinfo | sort -u ;;
            Windows) powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" ;;
            macOS) sysctl -n machdep.cpu.brand_string ;;
          esac
      - name: Install Tesseract and a silent sound server
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libtesseract5 tesseract-ocr-eng pulseaudio
          pulseaudio --daemonize=true --exit-idle-time=-1 -n --load="module-null-sink sink_name=silent" --load="module-native-protocol-unix"
      - name: Cache the voice files and the real-world PDF corpus
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pdfviewerlite/kokoro
            ~/.cache/pdfviewerlite/melo
            ~/.cache/pdfviewerlite/corpus
          key: cross-${{ runner.os }}-${{ hashFiles('src/PdfViewerLite.Speech/VoiceRelease.cs', 'tests/corpus/corpus.json') }}
      - name: Build
        run: dotnet build PdfViewerLite.slnx -c Release
      - name: Test
        env:
          PDFVIEWERLITE_KOKORO_DOWNLOAD: '1'
          PDFVIEWERLITE_MELO_DOWNLOAD: '1'
          PDFVIEWERLITE_CORPUS_DOWNLOAD: '1'
        run: dotnet test --solution PdfViewerLite.slnx -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/**'
          if-no-files-found: ignore
