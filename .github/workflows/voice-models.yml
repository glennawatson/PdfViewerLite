name: Voice models

# Builds the on-device voice files and publishes them as a GitHub release, so the app downloads its voices from this
# repository and nowhere else: MeloTTS-English and the BERT layers it reads, exported to ONNX with the text front end's
# data, and a mirror of the Kokoro-82M files. Python is used here only; the app reads the results with ONNX Runtime.
on:
  workflow_dispatch:
  push:
    paths:
      - tools/voice-models/**
      - .github/workflows/voice-models.yml

permissions:
  contents: write

env:
  # Bump with VoiceRelease.ReleaseTag in src/PdfViewerLite.Speech/VoiceRelease.cs when the files change.
  RELEASE_TAG: voices-1
  MELO_COMMIT: 209145371cff8fc3bd60d7be902ea69cbdb7965a
  KOKORO_ONNX: https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/1939ad2a8e416c0acfeecc08a694d14ef25f2231
  MISAKI: https://raw.githubusercontent.com/hexgrad/misaki/fba1236595f2d2bf21d414ba6e57d25256afada3/misaki/data

jobs:
  check:
    name: Check whether the release is published
    runs-on: ubuntu-24.04
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      # A published release is never changed: the app pins each file's SHA-256, so new files need a new tag.
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Export and publish
    needs: check
    if: needs.check.outputs.published != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the export tools
        run: pip install -r tools/voice-models/requirements.txt
      - name: Fetch MeloTTS at a pinned commit and trim it to English
        run: |
          git clone https://github.com/myshell-ai/MeloTTS melo-src
          git -C melo-src checkout "$MELO_COMMIT"
          python tools/voice-models/patch_melo.py melo-src
          python -m nltk.downloader cmudict averaged_perceptron_tagger averaged_perceptron_tagger_eng
      - name: Export MeloTTS, BERT, the lexicon and the spelling-to-sound network
        run: python tools/voice-models/export_melo.py melo-src release
      - name: Check the exported voice against PyTorch
        run: python tools/voice-models/check_melo.py melo-src release
      - name: Mirror the Kokoro files
        run: tools/voice-models/mirror_kokoro.sh release
      - name: Write the manifest
        run: python tools/voice-models/manifest.py release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --title "Voice files ($RELEASE_TAG)" \
            --notes "On-device voices for Read Aloud: MeloTTS-English (MIT) with bert-base-uncased (Apache-2.0), and a mirror of Kokoro-82M (Apache-2.0) with the misaki dictionaries (Apache-2.0). Built by the Voice models workflow; voices.json lists every file's SHA-256."
