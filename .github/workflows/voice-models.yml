name: Voice models

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the pinned voice release after validation
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - tools/voice-models/**
      - .github/workflows/voice-models.yml

permissions:
  contents: read

concurrency:
  group: voice-models
  cancel-in-progress: false

env:
  RELEASE_TAG: voices-2
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  generate:
    name: Generate and validate voice files
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dotnet-environment
        with:
          dotnet-versions: |
            10.0.x
            11.0.100-rc.1.26425.128
          minver-minimum-major-minor: '0.1'
      - name: Check the pinned release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: dotnet run --file tools/voice-models/release.cs -- check "$RELEASE_TAG" "$PUBLISH"
      - name: Import the pinned MeloTTS files
        if: steps.release.outputs.generate == 'true'
        run: dotnet run --file tools/voice-models/import_melo.cs -- tools/voice-models/melo-source.json release
      - name: Check the upstream reference and synthesis
        if: steps.release.outputs.generate == 'true'
        run: >-
          dotnet run --file tools/voice-models/check_melo.cs --
          tools/voice-models/melo-source.json release
          tests/PdfViewerLite.Core.Tests/Speech/Melo/melo-reference.json
      - name: Import the pinned Kokoro files
        if: steps.release.outputs.generate == 'true'
        run: dotnet run --file tools/voice-models/mirror_kokoro.cs -- release
      - name: Write the manifest
        if: steps.release.outputs.generate == 'true'
        run: dotnet run --file tools/voice-models/manifest.cs -- release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.release.outputs.generate == 'true'
        with:
          name: voice-models-${{ env.RELEASE_TAG }}
          path: release/*
          if-no-files-found: error
      - name: Publish the voice release
        if: steps.release.outputs.generate == 'true' && (github.event_name == 'push' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --file tools/voice-models/release.cs -- publish "$RELEASE_TAG" release
